name: SantoroMail
options:
  bundleIdPrefix: com.hanifhawlader
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Santoro Mail
    INFOPLIST_KEY_NSHumanReadableCopyright: "Santoro · Hanif Hawlader"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  SantoroMail-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: SantoroMail
        PRODUCT_BUNDLE_IDENTIFIER: com.hanifhawlader.santoromail
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
  SantoroMail-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Santoro Mail
        PRODUCT_BUNDLE_IDENTIFIER: com.hanifhawlader.santoromail.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
