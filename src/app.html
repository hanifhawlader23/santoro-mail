<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Santoro Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#F7F5E9; --bg2:#FCFBF5; --fg:#000; --fg2:rgba(0,0,0,.66); --fg3:rgba(0,0,0,.44);
  --line:rgba(91,26,44,.13); --line2:rgba(91,26,44,.22); --wash:rgba(91,26,44,.05); --wash2:rgba(91,26,44,.09);
  --acc:#5B1A2C; --acc-d:#46121f; --at:#5B1A2C; --on:#F7F5E9; --hf:#000; --onh:#F7F5E9; --hw:rgba(0,0,0,.07);
  --scrim:rgba(39,3,3,.28); --shadow:rgba(39,3,3,.22); color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0A0708; --bg2:#141012; --fg:#F7F5E9; --fg2:rgba(247,245,233,.74); --fg3:rgba(247,245,233,.48);
  --line:rgba(247,245,233,.09); --line2:rgba(247,245,233,.17); --wash:rgba(247,245,233,.04); --wash2:rgba(91,26,44,.5);
  --acc:#5B1A2C; --acc-d:#6d2236; --at:#DDBDC5; --on:#F7F5E9; --hf:#F7F5E9; --onh:#000; --hw:rgba(247,245,233,.09);
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.6); color-scheme:dark;
}
:root{--r:8px;--r-s:5px;--f:'El Messiri','Hind Siliguri',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--fg);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
select,input,textarea{background:var(--bg)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3)}
.muted{color:var(--fg3)}
.acc{color:var(--at)}
.sp{flex:1}

#app{display:grid;grid-template-columns:236px 1fr;height:100%}
.rail{border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:30px;height:28px;color:var(--at)}
.brand b{display:block;font-weight:600;letter-spacing:.32em;font-size:13px;color:var(--at)}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--fg3)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{padding:7px 4px;font-size:11px;color:var(--fg2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--on)}
.seg button.on[data-v="hanif"]{background:var(--hf);color:var(--onh)}
.btn-compose{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--on);border-radius:var(--r);padding:11px;font-size:13px;letter-spacing:.06em}
.btn-compose:hover{background:var(--acc-d)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);color:var(--fg2);text-align:left;font-size:13px}
.nav button:hover{background:var(--wash)}
.nav button.on{background:var(--wash2);color:var(--at)}
.nav .n{margin-left:auto;font-size:11px;color:var(--fg3)}
.nav button.on .n{color:var(--at)}
.rail .grp>.cap{display:block;padding:0 10px 6px}
.rail>*{flex-shrink:0}
.rail .foot{margin-top:auto;font-size:10.5px;color:var(--fg3);padding:0 8px;line-height:1.6}
.dot{display:inline-block;width:6px;height:6px;border-radius:1.5px;background:var(--acc);margin-right:6px;vertical-align:1px}

main{position:relative;overflow:hidden;height:100%}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* list */
.list{width:390px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.list-h{padding:18px 20px 10px;display:flex;flex-direction:column;gap:12px}
.lh-row{display:flex;align-items:center;gap:10px}
.lh-row h1{font-size:19px;font-weight:500;display:flex;align-items:baseline;gap:10px}
.lh-row h1 span{font-size:11px;color:var(--fg3);letter-spacing:.06em}
.fold-btn{display:none;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:var(--r-s);padding:5px 9px;font-size:12px;color:var(--fg2)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--bg2)}
.search input{border:0;outline:0;background:none;width:100%;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);border-radius:var(--r-s);padding:4px 10px;font-size:11.5px;color:var(--fg2);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.pulse{margin:0 20px 10px;background:var(--acc);color:var(--on);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.pulse .pat{position:absolute;right:-18px;bottom:-26px;width:150px;height:140px;color:var(--on);opacity:.08;pointer-events:none}
.pulse .cap{color:rgba(247,245,233,.7)}
.pulse p{font-size:13px;margin-top:6px;max-width:92%;white-space:pre-wrap;position:relative}
.pulse button{margin-top:10px;font-size:11.5px;border:1px solid rgba(247,245,233,.45);border-radius:var(--r-s);padding:5px 10px;display:inline-flex;gap:6px;align-items:center;position:relative;color:var(--on)}
.banner{margin:0 20px 10px;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--fg2);display:flex;gap:10px;align-items:center}
.items{overflow-y:auto;flex:1;padding-bottom:110px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:hover{background:var(--wash)}
.item.sel{background:var(--wash2)}
.item::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ac,transparent);opacity:.45}
.item.unread{background:color-mix(in srgb,var(--ac,var(--acc)) 8%,var(--bg))}
.item.unread:hover{background:color-mix(in srgb,var(--ac,var(--acc)) 13%,var(--bg))}
.item.unread::after{top:0;bottom:0;width:5px;border-radius:0;opacity:1}
.item.unread .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac,var(--acc))}
.item.unread .sub{font-weight:600;color:var(--fg)}
.item.unread .meta>span:first-child{color:var(--ac,var(--at));font-weight:600}
.item:not(.unread) .who,.item:not(.unread) .sub{color:var(--fg2)}
.item .newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac,var(--acc));margin-right:6px;vertical-align:middle}
.tag.ac{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
[data-theme="dark"] .tag.ac{color:color-mix(in srgb,var(--ac) 55%,#fff)}
.av img,.avimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.av.pic{padding:0;overflow:hidden;background:none}
.amk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 4px;border-radius:5px;background:var(--ac);color:#fff;font-size:9.5px;letter-spacing:.08em}
.hello{margin:0 20px 12px;display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.hello .hav{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--on)}
.hello .hav svg{width:40px;height:38px}
.hello h2{font-size:20px;font-weight:500;margin:1px 0 2px;letter-spacing:.01em}
.hello p{font-size:12.5px;color:var(--fg2);margin:0}
.hello .cap{font-size:10px}
.hello .ai{margin-left:auto;align-self:center;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--at);white-space:nowrap}
.hello-out{margin:-4px 20px 12px;padding:12px 14px;border-radius:12px;background:var(--wash);font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--fg2)}
.cbody[contenteditable]{min-height:220px;outline:0;font-size:15px;line-height:1.7;padding:14px 0;white-space:pre-wrap;word-wrap:break-word}
.cbody[contenteditable]:empty::before{content:attr(data-ph);color:var(--fg3)}
.cbody b,.cbody strong{font-weight:700}
.cbody b.hl,.cbody font[color],.cbody span[style*="color"]{color:var(--at)!important;font-weight:700}
.rd-text b.hl{color:var(--at)}
.fmtb{display:inline-flex;gap:2px;margin-right:6px;padding-right:6px;border-right:1px solid var(--line)}
.fmtb button{width:32px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.fmtb button:hover{background:var(--wash2)}
.fmtb .w{color:var(--at);font-weight:700}
.hlopt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);padding:8px 0}
.alnum{font-size:11px;color:var(--fg3);width:16px;text-align:right}
.alsrc{display:inline-block;font-size:10px;letter-spacing:.06em;border-radius:4px;padding:1px 6px;margin-top:4px}
.alsrc.ok{background:color-mix(in srgb,#2F6A66 16%,transparent);color:#2F6A66}
.alsrc.seen{background:var(--wash2);color:var(--at)}
.alsrc.wait{background:var(--wash);color:var(--fg3)}
[data-theme="dark"] .alsrc.ok{color:#8fd0c8}
.alrow{grid-template-columns:auto auto 1fr auto!important}
@media(max-width:860px){#listH h1{font-size:23px;line-height:1.2}#listH h1 span{display:none}body:not(.showf) #listH .chips{display:none}.hello{margin:0 16px 10px}.hello-out{margin:-2px 16px 10px}}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:translateY(-160px);opacity:0;pointer-events:none}
#ptr svg{width:28px;height:26px}
#ptr.spin svg{animation:ptrspin .9s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.items{overscroll-behavior-y:contain}
@media(max-width:860px){.lh-row .btn.dskonly{display:none}}
.sugg{margin-top:18px;border:1px dashed var(--line2);border-radius:var(--r);padding:14px}
.sugg h4{margin:0 0 4px;font-weight:500;font-size:14px}
.sgrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sgrow:first-of-type{border-top:0}
.sgrow b{display:block;font-weight:500;font-size:14px}
.sgrow span{font-size:12px;color:var(--fg3)}
.sgrow .bt{display:flex;gap:6px}
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:10px;font-size:12.5px;color:var(--fg2);padding:4px 0;line-height:1.5}
.steps li::before{content:counter(st);flex:none;width:20px;height:20px;border-radius:6px;background:var(--acc);color:var(--on);font-size:11px;display:flex;align-items:center;justify-content:center}
.fm .fld.wide{grid-column:1/-1}
.swtray{position:absolute;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:0;background:linear-gradient(180deg,var(--bg2),var(--wash));box-shadow:inset 0 2px 6px rgba(0,0,0,.08)}
.swtray.l{left:0}.swtray.r{right:0;flex-direction:row-reverse}
.swtray button{width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;letter-spacing:.05em;color:var(--fg2);background:none}
.swtray button b{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#F7F5E9;
 background:linear-gradient(150deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000) 100%);
 box-shadow:0 7px 14px -4px color-mix(in srgb,var(--c) 70%,transparent),0 2px 3px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.18);
 transition:transform .15s,box-shadow .15s}
.swtray button b svg.i{width:21px;height:21px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.swtray button:active b{transform:translateY(2px) scale(.96);box-shadow:0 3px 6px -2px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.swtray button.ask b{background:#F7F5E9;color:var(--c);box-shadow:0 0 0 2px var(--c),0 8px 16px -4px color-mix(in srgb,var(--c) 70%,transparent);animation:askpulse 1s ease-in-out infinite}
.swtray button.ask span{color:var(--c);font-weight:600}
@keyframes askpulse{50%{transform:scale(1.07)}}
html,body,.list,#items,.items{position:relative;overflow-x:hidden;overscroll-behavior-x:none}
.item{z-index:1;background:var(--bg);touch-action:pan-y}
.item.unread{background:color-mix(in srgb,var(--ac,var(--acc)) 8%,var(--bg))}
.frombtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:4px 0;font-size:14px;color:var(--fg);min-width:0}
.frombtn .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frombtn small{color:var(--fg3);font-size:11.5px}
.fromlist{position:fixed;z-index:120;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:6px;max-height:60vh;overflow:auto}
.fromlist button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:10px}
.fromlist button:hover,.fromlist button.on{background:var(--wash)}
.fromlist .mk{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;letter-spacing:.06em}
.fromlist b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fromlist small{display:block;font-size:11.5px;color:var(--fg3)}
.fromlist h6{margin:6px 10px 4px;font-size:10px;letter-spacing:.16em;color:var(--fg3);font-weight:500}
.fmtchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:130;display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--on);border-radius:999px;padding:12px 20px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:chipin .3s ease}
.fmtchip svg.i{width:18px;height:18px}
@keyframes chipin{from{opacity:0;transform:translate(-50%,10px)}}
.dg{margin:-4px 20px 14px;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.dg-top{font-size:13.5px;line-height:1.5;padding:2px 2px 10px;border-bottom:1px solid var(--line);color:var(--fg)}
.dg-top svg.i{width:15px;height:15px;color:var(--at);vertical-align:-2px}
.dg-sec{padding-top:10px}
.dg-h{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:4px}
.dg-h svg.i{width:14px;height:14px}.dg-h em{font-style:normal;color:var(--at);letter-spacing:0}
.dg-act{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;color:var(--at);border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
.dg-it{display:flex;gap:8px;width:100%;text-align:left;padding:6px 4px;border-radius:8px;font-size:13px;min-width:0}
.dg-it:hover{background:var(--wash)}
.dg-it b{flex:none;font-weight:500;white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.dg-it span{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dg-more{font-size:11.5px;color:var(--fg3);padding:2px 4px}
.dg-foot{font-size:10.5px;color:var(--fg3);margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
@media(max-width:860px){.dg{margin:-2px 16px 12px}}
#to-sug:empty{display:none}
#to-sug{border-bottom:1px solid var(--line);padding:8px 0 10px}
#to-sug .favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#to-sug .favs::-webkit-scrollbar{display:none}
#to-sug .fc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;font-size:11px;color:var(--fg2)}
#to-sug .fc .av{width:42px;height:42px;position:relative}
#to-sug .fc .av i{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:6px;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center}
#to-sug .fc .av i svg.i{width:10px;height:10px}
#to-sug .cap{display:block;margin:0 0 6px;font-size:10px}
#to-sug .sg{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 4px;border-radius:10px}
#to-sug .sg:hover,#to-sug .sg.on{background:var(--wash)}
#to-sug .sg b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#to-sug .sg small{display:block;font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#to-sug .sg .hv{color:var(--at)}#to-sug .sg .hv svg.i{width:15px;height:15px}
@media (hover:none) and (pointer:coarse){input,select,textarea,[contenteditable],.cf input,.cf select,.fld input,.fld select,.fld textarea,#c-body,.search input{font-size:16px!important}}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.attl{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.attc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:5px 6px 5px 9px;font-size:12.5px;max-width:100%}
.attc b{font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attc small{color:var(--fg3)}
.attc svg.i{width:14px;height:14px}.attc button{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.chk{padding:6px 0 2px}.chk li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;list-style:none}
.chk li i{flex:none;width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,#B2475E 16%,transparent);color:#B2475E;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.chk li small{display:block;color:var(--fg3);font-size:12px;margin-top:2px}
.achips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
@media(max-width:860px){.lh-row .btn .lbl{display:none}}
[data-theme="dark"] .achip i,[data-theme="dark"] .item .newdot{background:color-mix(in srgb,var(--ac) 62%,#fff)}
[data-theme="dark"] .achip b,[data-theme="dark"] .item.unread .meta>span:first-child{color:color-mix(in srgb,var(--ac) 55%,#fff)}
[data-theme="dark"] .item.unread::after{background:color-mix(in srgb,var(--ac) 75%,#fff)}
[data-theme="dark"] .achip.on{background:color-mix(in srgb,var(--ac) 80%,#fff 0%)}
.achips::-webkit-scrollbar{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line2);border-radius:999px;padding:5px 11px 5px 7px;font-size:12px;color:var(--fg2)}
.achip i{width:9px;height:9px;border-radius:50%;background:var(--ac);display:block}
.achip b{font-weight:600;color:var(--ac);font-size:11px}
.achip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.achip.on i{background:#fff}.achip.on b{color:#fff}
.rd-alias{height:4px;background:var(--ac);border-radius:0 0 3px 3px;margin:0 0 4px}
.rd-to{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:999px;padding:2px 9px}
[data-theme="dark"] .rd-to{color:color-mix(in srgb,var(--ac) 55%,#fff)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border-radius:9px;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg);display:flex;align-items:center;justify-content:center;color:#fff}
.swatches button.on{border-color:var(--c)}
.swatches button svg.i{width:16px;height:16px;opacity:0}
.swatches button.on svg.i{opacity:1}
.mobonly{display:none}@media(max-width:860px){.mobonly{display:inline-flex}}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.profcard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);padding:16px;display:flex;gap:14px;align-items:center}
.profcard .ph{width:72px;height:72px;border-radius:14px;flex:none;overflow:hidden;background:var(--wash2);display:flex;align-items:center;justify-content:center;color:var(--at);font-size:20px;letter-spacing:.06em}
.profcard .ph.h{background:var(--hw);color:var(--fg)}
.profcard b{display:block;font-weight:500;font-size:14px}
.profcard small{display:block;color:var(--fg3);font-size:11.5px;margin:2px 0 8px}
.profcard .bt{display:flex;gap:6px;flex-wrap:wrap}
.sigst{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.me-av{width:28px;height:28px;border-radius:7px;overflow:hidden;flex:none}
@media(max-width:860px){.prof{grid-template-columns:1fr}}
.av .lg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:inherit;padding:4px}
.av{position:relative;overflow:hidden;width:36px;height:36px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;font-size:12.5px;letter-spacing:.04em;background:var(--wash2);color:var(--at);flex:none}
.av.h{background:var(--hw);color:var(--fg)}
.item .who{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.unread .who{font-weight:600}
.item .sub{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .snip{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--fg3)}
.item .meta .row{display:flex;gap:4px;align-items:center}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid var(--line2);color:var(--at);white-space:nowrap}
.tag.h{color:var(--fg);border-color:var(--line2)}
.tag.solid{background:var(--acc);color:var(--on);border-color:var(--acc)}
.tag.warn{background:var(--acc);color:var(--on);border-color:var(--acc)}
.starred{color:var(--at)}
.starred svg.i{fill:currentColor}
.empty{padding:60px 30px;text-align:center;color:var(--fg3)}
.empty svg{width:70px;height:66px;color:var(--at);opacity:.15;margin-bottom:12px}

/* reader */
.reader{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg2)}
.rd-bar{display:flex;align-items:center;gap:2px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r-s);font-size:12px;color:var(--fg2)}
.ib:hover{background:var(--wash);color:var(--at)}
.ib.ai{color:var(--at)}
.ib.on{color:var(--at)}
.ib.on svg.i{fill:currentColor}
.rd-body{overflow-y:auto;flex:1;padding:28px 40px 110px}
.rd-body h2{font-size:22px;font-weight:500;line-height:1.3;margin-bottom:16px;max-width:680px}
.rd-from{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.rd-from .nm{font-size:13.5px}
.rd-from .em{font-size:11.5px;color:var(--fg3)}
.rd-text{white-space:pre-wrap;font-size:14px;line-height:1.75;max-width:640px}
.att{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.att span{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:var(--r-s);padding:7px 10px;font-size:12px}
.att b{font-weight:500;color:var(--at);font-size:10px;letter-spacing:.1em}
.qr{display:flex;gap:8px;flex-wrap:wrap;max-width:640px;margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.qr .cap{width:100%;display:flex;gap:6px;align-items:center;color:var(--at)}
.qr button{border:1px solid var(--line2);border-radius:var(--r-s);padding:7px 12px;font-size:12.5px;text-align:left;max-width:100%}
.qr button:hover{border-color:var(--at);color:var(--at)}
.aibox{max-width:640px;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;background:var(--bg)}
.aibox .cap{color:var(--at);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.aibox .out{white-space:pre-wrap;font-size:13px;line-height:1.65}
.aibox .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.aibox.warn{border-color:var(--acc);border-width:1.5px}
.sel-s{border:1px solid var(--line2);border-radius:var(--r-s);padding:5px 8px;background:var(--bg2);font-size:12px}
.btn{border:1px solid var(--line2);border-radius:var(--r-s);padding:6px 12px;font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--at);color:var(--at)}
.btn.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn.pri:hover{background:var(--acc-d);color:var(--on)}
.back{display:none}

/* pages */
.page{flex:1;overflow-y:auto;padding:28px 40px 120px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:500}
.page-h p{font-size:12.5px;color:var(--fg3);max-width:520px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--bg2)}
.stat b{display:block;font-size:24px;font-weight:500;color:var(--at);line-height:1.2}
.stat small{font-size:11px;color:var(--fg3)}
.stat.dark{background:var(--acc);border-color:var(--acc)}
.stat.dark b,.stat.dark .cap,.stat.dark small{color:var(--on)}
.sec{margin-bottom:28px}
.sec>.cap{margin-bottom:10px;display:block}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);padding:16px 18px}
.dgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:12px}
.bar .tr{height:8px;border-radius:2px;background:var(--wash2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc)}
.bar span:last-child{text-align:right;color:var(--fg3)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end;margin-top:14px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .cols{display:flex;gap:3px;align-items:flex-end;height:120px}
.week .cols i{width:9px;border-radius:2px 2px 0 0;background:var(--line2)}
.week .cols i.s{background:var(--acc)}
.week small{font-size:10.5px;color:var(--fg3)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--fg3);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;background:var(--bg);outline:0;font-size:13px}
.ask-out{white-space:pre-wrap;font-size:13px;line-height:1.65;margin-top:12px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-child{border-bottom:0}
.trow{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);margin-bottom:8px;overflow:hidden}
.trow-h{display:grid;grid-template-columns:1fr auto;gap:14px;padding:13px 16px;cursor:pointer;align-items:center}
.trow-h:hover{background:var(--wash)}
.trow .sub{font-size:13.5px}
.trow .to{font-size:11.5px;color:var(--fg3)}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--wash2);color:var(--at);white-space:nowrap}
.bdg.off{background:var(--hw);color:var(--fg3)}
.bdg.solid{background:var(--acc);color:var(--on)}
.bdg svg.i{width:12px;height:12px}
.temp{display:inline-flex;gap:2px}
.temp i{width:7px;height:7px;border-radius:1.5px;background:var(--line2)}
.temp i.f{background:var(--at)}
.trow-d{padding:4px 16px 16px;border-top:1px solid var(--line);display:none}
.trow.open .trow-d{display:block}
.tl{list-style:none;margin:12px 0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12px;padding:5px 0}
.tl li .t{color:var(--fg3)}
.tl li .ev{display:flex;gap:6px;align-items:flex-start}
.tl li .ev svg{margin-top:2px;color:var(--at)}
.note{font-size:11.5px;color:var(--fg3);border-left:2px solid var(--line2);padding:4px 10px;margin:8px 0}
.hint{font-size:12px;display:flex;gap:8px;align-items:center;color:var(--at);margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--at)}
.card h3{font-size:14px;font-weight:500}
.card p{font-size:12px;color:var(--fg3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sigcard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.sigcard .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sigcard .pv{padding:22px 18px;background:#fff;color:#000}
.sigcard .fm{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;font-size:12.5px;outline:0}
.fld input:focus,.fld textarea:focus{border-color:var(--at)}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row .lb{flex:1;min-width:200px}
.set-row .lb b{font-weight:500;display:block;font-size:13.5px}
.set-row .lb span{font-size:12px;color:var(--fg3)}
.set-row .seg{width:260px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.step .no{width:26px;height:26px;border-radius:var(--r-s);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--at)}
.step .no.ok{background:var(--acc);color:var(--on);border-color:var(--acc)}
.step b{font-weight:500}
.step .d{font-size:12px;color:var(--fg3)}
.step ol{font-size:12.5px;color:var(--fg2);padding-left:18px;margin-top:6px;line-height:1.7}
.kbd{display:inline-block;min-width:20px;text-align:center;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;margin-right:8px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;font-size:12.5px;color:var(--fg2)}

/* compose & sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex}
.sheet{background:var(--bg2);width:min(780px,100%);max-height:100%;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px var(--shadow)}
.sheet.sm{width:min(380px,100%)}
.sh-top{background:var(--acc);color:var(--on);padding:12px 18px;display:flex;align-items:center;gap:10px}
.sh-top.h{background:var(--hf);color:var(--onh)}
.sh-top svg.logo{width:22px;height:20px;color:currentColor}
.sh-top b{font-weight:500;letter-spacing:.2em;font-size:12px}
.sh-top .x{margin-left:auto;color:currentColor;padding:4px}
.sh-body{overflow-y:auto;padding:4px 18px 10px}
.cf{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:7px 0}
.cf label{font-size:11px;color:var(--fg3);letter-spacing:.06em}
.cf input,.cf select{border:0;outline:0;background:none;font-size:13.5px;padding:3px 0;width:100%}
.c-tools{display:flex;gap:2px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.c-tones{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.c-tones .cap{margin-right:4px}
.c-ai{display:none;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.c-ai.on{display:flex}
.c-ai input{flex:1;min-width:180px;border:1px solid var(--line2);border-radius:var(--r-s);padding:6px 9px;outline:0;font-size:12.5px}
textarea.cbody{width:100%;min-height:200px;border:0;outline:0;background:none;resize:vertical;font-size:14px;line-height:1.7;padding:14px 0}
.c-sig{border-top:1px dashed var(--line2);padding:14px 0 6px}
.c-sig .pv{background:#fff;color:#000;padding:14px;border-radius:var(--r-s)}
.c-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:10px;font-size:12.5px}
.sw{width:30px;height:17px;border-radius:4px;background:var(--line2);position:relative;flex:none;transition:.15s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:3px;background:var(--bg2);transition:.15s}
.sw.on{background:var(--acc)}
.sw.on::after{left:15px;background:var(--on)}
.opt select,.opt input{border:1px solid var(--line);border-radius:var(--r-s);padding:4px 6px;font-size:12px;outline:0}
.sh-foot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.send{background:var(--acc);color:var(--on);border-radius:var(--r-s);padding:9px 20px;display:inline-flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.05em}
.send.h{background:var(--hf);color:var(--onh)}
.tplpick{display:none;border:1px solid var(--line2);border-radius:var(--r);margin:8px 0;max-height:220px;overflow:auto;background:var(--bg)}
.tplpick.on{display:block}
.tplpick button{display:block;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.tplpick button:hover{background:var(--wash)}
.flist button{display:flex;width:100%;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--fg2)}
.flist button.on{color:var(--at);background:var(--wash2)}
.flist .n{margin-left:auto;font-size:12px;color:var(--fg3)}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--hf);color:var(--onh);border-radius:var(--r);padding:10px 14px;font-size:12.5px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px var(--shadow);max-width:92vw}
.toast.w{background:var(--acc);color:var(--on)}
.toast button{color:inherit;text-decoration:underline;font-size:12.5px}
.menu{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 10px 30px var(--shadow);padding:4px;min-width:210px}
.menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;font-size:12.5px;border-radius:var(--r-s)}
.menu button:hover{background:var(--wash)}

.tabbar,.fab,.mtop{display:none}

@media (max-width:900px){
  body{font-size:14px}
  #app{grid-template-columns:1fr}
  .rail{display:none}
  .list{width:100%;border-right:0}
  .fold-btn{display:inline-flex}
  .reader{position:absolute;inset:0;z-index:5;transform:translateX(100%);transition:transform .22s ease}
  body.reading .reader{transform:none}
  .back{display:inline-flex}
  .rd-body{padding:22px 20px 110px}
  .rd-bar{padding:8px 10px}
  .rd-bar .lbl{display:none}
  .rd-bar .ai .lbl{display:inline;font-size:11px}
  .rd-bar .ib{padding:6px 6px}
  .page{padding:20px 18px 130px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .sigs{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--fg3);padding:4px 0}
  .tabbar button.on{color:var(--at)}
  .tabbar svg.i{width:20px;height:20px}
  .fab{display:flex;position:fixed;right:18px;bottom:80px;z-index:21;width:52px;height:52px;border-radius:12px;background:var(--acc);color:var(--on);align-items:center;justify-content:center;box-shadow:0 8px 24px var(--shadow)}
  .fab svg.i{width:22px;height:22px}
  body.reading .fab{display:none}
  .scrim{padding:0}
  .sheet{border-radius:0;height:100%;width:100%}
  .sheet.sm{height:auto;margin-top:auto;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .c-opts{grid-template-columns:1fr}
  .mtop{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
  .mtop svg.logo{width:26px;height:24px;color:var(--at)}
  .mtop b{font-weight:600;letter-spacing:.3em;font-size:12px;color:var(--at)}
  .mtop .seg{margin-left:auto;width:190px}
  .mtop .seg button{font-size:10.5px;padding:5px 2px}
  .toasts{bottom:150px}
  .tl li{grid-template-columns:78px 1fr}
  .bar{grid-template-columns:90px 1fr 24px}
  .set-row .seg{width:100%}
}

.favs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:54px;font-size:10.5px;color:var(--fg2);position:relative}
.fav .av{width:44px;height:44px;font-size:13px;border-radius:10px}
.fav.on .av{outline:2px solid var(--acc);outline-offset:2px}
.fav .hb{position:absolute;top:30px;right:4px;width:16px;height:16px;border-radius:4px;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center}
.fav .hb svg.i{width:10px;height:10px;fill:currentColor;stroke-width:1}
.fav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px}
.grp-h{padding:14px 20px 6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.grp-h.pin{color:var(--at)}
.item.pinned{background:linear-gradient(90deg,var(--wash2),transparent 60%)}
.heart svg.i,.pinic svg.i{fill:currentColor}
.heart{color:var(--at)}
.cfilter{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--at)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard.fv{border-color:var(--line2);background:linear-gradient(180deg,var(--wash2),var(--bg2) 55%)}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .top .av{width:44px;height:44px;border-radius:10px}
.pcard .nm{font-size:14px}
.pcard .em{font-size:11.5px;color:var(--fg3)}
.pcard .st{display:flex;gap:14px;font-size:11.5px;color:var(--fg3);flex-wrap:wrap}
.pcard .st b{color:var(--fg);font-weight:500}
.hbtn{margin-left:auto;padding:6px;border-radius:var(--r-s);color:var(--fg3)}
.hbtn.on{color:var(--at)}
.hbtn.on svg.i{fill:currentColor}
.rule{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:8px}
.rule.off{opacity:.55}
.rule .ico{width:36px;height:36px;border-radius:var(--r-s);background:var(--wash2);color:var(--at);display:flex;align-items:center;justify-content:center}
.rule .nm{font-size:13.5px}
.rule .flow{font-size:11.5px;color:var(--fg3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.rule .flow b{font-weight:500;color:var(--fg2)}
.rule .rt{display:flex;gap:8px;align-items:center}
.pill{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--hw);color:var(--fg3)}
.pill.ok{background:var(--wash2);color:var(--at)}
.log li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);list-style:none}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.conn .c{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg2);display:flex;flex-direction:column;gap:6px}
.conn .c b{font-weight:500;display:flex;gap:8px;align-items:center}
.conn .c small{font-size:11.5px;color:var(--fg3)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--hw);padding:6px 8px;border-radius:4px;word-break:break-all}
.bmails{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bmail{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.bmail .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px}
.bmail .pv{background:#EFEDE2;padding:16px;max-height:520px;overflow:auto}
.bld{display:grid;gap:12px;padding:16px 18px}
.bld .flowrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}
.bld .flowrow>span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--at)}
.bld select,.bld input{border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;font-size:13px;outline:0;width:100%}
.testout{white-space:pre-wrap;font-size:13px;line-height:1.65;padding:16px 18px;overflow:auto}
@media (max-width:900px){.rule{grid-template-columns:auto 1fr}.rule .rt{grid-column:1/-1;justify-content:flex-end}.bmails{grid-template-columns:1fr}}

a.btn{color:inherit;text-decoration:none}
.att a.btn{color:var(--at)}
.hamb{display:none;width:40px;height:40px;border-radius:10px;align-items:center;justify-content:center;color:var(--fg);margin-left:-8px;flex:none}
.hamb svg.i{width:22px;height:22px}
.aichips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 20px}
.aichips button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:var(--r-s);padding:7px 12px;font-size:12.5px;color:var(--at)}
.rd-mob{display:none}
.drawer-bg{display:none}
.acct{display:flex;gap:10px;align-items:center;padding:8px 10px;font-size:12.5px;color:var(--fg2)}
.acct .ms{width:26px;height:26px;border-radius:6px;background:var(--hw);display:flex;align-items:center;justify-content:center;flex:none}
.alrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.alrow .mk{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--wash2);color:var(--at);font-size:12px;letter-spacing:.06em}
.alrow .mk.h{background:var(--hw);color:var(--fg)}
.alrow b{font-weight:500;font-size:13.5px;display:block}
.alrow span{font-size:12px;color:var(--fg3)}
.stp{font-size:12.5px;color:var(--fg2);line-height:1.7;padding-left:18px;margin:4px 0 0}
@media (max-width:900px){
  .mtop{display:none!important}
  .hamb{display:inline-flex}
  .rail{display:flex;position:fixed;top:0;bottom:0;left:0;width:84%;max-width:330px;z-index:70;background:var(--bg);transform:translateX(-105%);transition:transform .25s ease;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
  body.drawer .rail{transform:none;box-shadow:10px 0 40px var(--shadow)}
  body.reading .tabbar{display:none}
  body:not([data-view="mail"]) .fab{display:none}
  .drawer-bg{position:fixed;inset:0;background:var(--scrim);z-index:65}
  body.drawer .drawer-bg{display:block}
  .rail .nav button{padding:11px 12px;font-size:15px;gap:12px}
  .rail .nav button svg.i{width:19px;height:19px}
  .rail .btn-compose{padding:14px;font-size:15px}
  .rail .seg button{padding:9px 4px;font-size:12.5px}
  .list-h{padding:14px 18px 10px;gap:10px}
  .lh-row h1{font-size:21px}
  .search{padding:10px 12px}
  .search input{font-size:15px}
  .chip{padding:8px 13px;font-size:13.5px}
  .item{grid-template-columns:42px 1fr auto;padding:15px 18px;gap:13px}
  .av{width:42px;height:42px;font-size:13.5px}
  .item .who{font-size:15.5px}
  .item .sub{font-size:14.5px}
  .item .snip{font-size:13.5px}
  .item .meta{font-size:12px}
  .pulse{margin:0 18px 8px;padding:13px 15px}
  .pulse .pat{display:none}
  .pulse p{font-size:14px}
  .rd-bar{padding:8px 10px;gap:4px}
  .rd-bar .ib{padding:9px}
  .rd-bar .ib svg.i{width:21px;height:21px}
  .rd-bar .dsk{display:none}
  .rd-body{padding:20px 18px 130px}
  .rd-body h2{font-size:21px}
  .rd-mob{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
  .rd-mob button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--fg2);padding:6px 0}
  .rd-mob button svg.i{width:22px;height:22px}
  .rd-mob button.pri{color:var(--at)}
  .aichips button{padding:9px 13px;font-size:13.5px}
  .page-h{align-items:center}
  .page-h h1{font-size:22px}
  .tabbar{grid-template-columns:repeat(5,1fr)}
  .tabbar button{font-size:11px;padding:5px 0}
  .tabbar svg.i{width:23px;height:23px}
  .btn{padding:9px 14px;font-size:13px}
  .fab{bottom:86px}
}

const MESES='enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre';
const RULES=[
 new RegExp(`\\b(?:el\\s+)?(?:lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)(?:\\s+\\d{1,2}(?:\\s+de\\s+(?:${MESES}))?)?\\b`,'gi'),
 new RegExp(`\\b\\d{1,2}\\s+de\\s+(?:${MESES})(?:\\s+(?:de\\s+)?\\d{4})?\\b`,'gi'),
 new RegExp(`\\b(?:${MESES})\\s+(?:de\\s+)?\\d{4}\\b`,'gi'),
 /\b\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?\b/g,
 /\b(?:hoy|mañana|pasado mañana|esta semana|la (?:semana|próxima semana) que viene|la próxima semana|este mes|el próximo mes|fin de mes|cuanto antes|lo antes posible|urgente)\b/gi,
 /\b(?:a\s+las?\s+)?\d{1,2}(?:[:.]\d{2})\s*(?:h|horas?|am|pm)?\b|\b(?:a\s+las?\s+)\d{1,2}\b(?:\s*(?:h|horas?|de la (?:mañana|tarde|noche)))?/gi,
 /(?:€|\$|£)\s?\d[\d.,]*|\b\d[\d.,]*\s?(?:€|euros?|EUR|\$|USD|dólares|£)/gi,
 /\b\d+(?:[.,]\d+)?\s?%/g,
 /\b\d[\d.,]*\s+(?:unidades|uds?\.?|camisas|camisetas|piezas|prendas|metros|m|kg|gramos|cajas|pedidos?|días|semanas|meses|horas|minutos|años|tallas|muestras|rollos)\b/gi,
 /\b(?:antes del?|hasta el|como (?:muy )?tarde el|fecha límite|vence(?: el)?)\s+[^.,;?¿!\n]{2,22}/gi,
 /\bhttps?:\/\/\S+|\b[\w.+-]+@[\w-]+\.[\w.]+\b/g,
 BIZ];
function personHighlight(txt){txt=String(txt||'');
 if(!/^\s*(?:==|\*\*)/.test(txt.split('\n').find(l=>l.trim())||''))txt=txt.replace(GREET,(m0,a,n)=>a+'=='+n+'==');
 txt=txt.replace(/^((?:un (?:cordial )?saludo|saludos(?: cordiales)?|atentamente|un abrazo|muchas gracias|gracias|cordialmente|best regards|kind regards|regards|best)[,.!]?\s*\n+)([^\n*=]{2,40}?)\s*$/im,(m0,a,n)=>a+'**'+n.trim()+'**');
 return txt}
function ruleHighlight(txt){txt=String(txt||'');const taken=[];
 for(const m of txt.matchAll(/\*\*[^*\n]+?\*\*|==[^=\n]+?==/g))taken.push([m.index,m.index+m[0].length]);
 let rs=[];RULES.forEach(re=>{re.lastIndex=0;for(const m of txt.matchAll(re)){let a=m.index,b=a+m[0].length;while(b>a&&/[\s,.;:]/.test(txt[b-1]))b--;if(b-a>1)rs.push([a,b])}});
 rs=rs.filter(([a,b])=>!taken.some(([x,y])=>a<y&&b>x)).sort((p,q)=>p[0]-q[0]||q[1]-p[1]);
 const merged=[];rs.forEach(r=>{const l=merged[merged.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else merged.push([...r])});
 let out='',k=0;merged.forEach(([a,b])=>{out+=txt.slice(k,a)+'**'+txt.slice(a,b)+'**';k=b});return out+txt.slice(k)}

async function aiHighlight(txt){let res=null;
 await ask(`Eres el diseñador de correos de Santoro. Devuelve EXACTAMENTE el mismo texto (mismas palabras, mismo orden, mismos saltos de línea), sin explicaciones. Las marcas ** y == que ya trae se quedan. ${FMT}\n\nTEXTO:\n${txt}`,x=>{res=x});
 if(!res||res===t('thinking'))return null;res=res.replace(/^\s*(?:TEXTO:\s*)?|\s+$/g,'');
 const norm=x=>mdStrip(x).replace(/\s+/g,' ').trim();return norm(res)===norm(txt)?res:null}
/* las marcas de la IA que abarcan media frase se quitan: solo palabras clave cortas */
const tidyAI=x=>x.replace(/==([^=\n]+?)==/g,(m0,a)=>a.trim().split(/\s+/).length>5?a:m0).replace(/\*\*([^*\n]+?)\*\*/g,(m0,a)=>a.trim().split(/\s+/).length>6?a:m0)
 .replace(/(\*\*|==)\s*(?:y|e|o|de|del|la|el|los|las|si|que|con|en|por|para)\s+/gi,'$1').replace(/\s+(?:y|e|o|de|del|la|el|los|las|si|que|con|en|por|para)\s*(\*\*|==)/gi,'$1');
async function designBody(txt){let r=ruleHighlight(personHighlight(txt));
 if(AI){const a=await Promise.race([aiHighlight(r),new Promise(z=>setTimeout(()=>z(null),14000))]);if(a)r=ruleHighlight(personHighlight(tidyAI(a)))}
 if(!/==/.test(r)){const all=[...r.matchAll(/\*\*([^*\n]+?)\*\*/g)],m=all.find(x=>/antes|hasta|plazo|límite|€|euro|total|urgente/i.test(x[1]))||all[0];if(m)r=r.replace(m[0],'=='+m[1]+'==')}   // siempre al menos una cosa en vino
 return r}

function matchRule(r){const inb=mails.filter(m=>m.folder==='inbox');
 if(r.w==='from')return inb.find(m=>m.from.e.includes(r.wv)||m.from.n.toLowerCase().includes((r.wv||'').toLowerCase()));
 if(r.w==='to')return inb.find(m=>m.to===r.wv);
 if(r.w==='has')return mails.find(m=>(m.sub+m.body).toLowerCase().includes((r.wv||'').toLowerCase()));
 if(['order','ship','signup'].includes(r.w))return {from:{n:'Javier Ruiz',e:'javier@cliente.demo'},to:'pedidos@hanifhawlader.com',sub:'Pedido #0012',body:'Pedido web #0012'};
 if(r.w==='noreply'){const s=sent.find(x=>x.wait&&!x.replied);return s&&{from:{n:s.to.n,e:s.to.e},to:s.from,sub:s.sub,body:s.body,_s:s}}

let refreshing=false;
async function doRefresh(){if(refreshing)return;refreshing=true;const p=ptrEl();p.classList.add('spin');p.style.opacity=1;p.style.transform='translateY(14px)';
 try{if(window.__refresh)await window.__refresh();else await new Promise(r=>setTimeout(r,700));renderAll();toast(t('refreshed'),{wine:true,ms:1600})}
 catch(e){toast(t('err')+': '+esc(e.message||e))}
 p.classList.remove('spin');p.style.opacity=0;p.style.transform='translateY(-160px)';refreshing=false}
function ptrEl(){let p=document.getElementById('ptr');if(!p){p=document.createElement('div');p.id='ptr';p.innerHTML=`<svg viewBox="0 0 900 843"><use href="#rider"/></svg>`;document.body.appendChild(p)}return p}
(()=>{let y0=null,x0=0,dy=0;
 const scroller=t=>{const s=t.closest('.items,.page,.reader');return s};
 document.addEventListener('touchstart',e=>{if(refreshing||$('#scrim').classList.contains('on')||document.body.classList.contains('drawer'))return;
  const t=e.target;if(!t.closest('.list,.page'))return;const s=scroller(t)||$('#items');if(s&&s.scrollTop>2)return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0},{passive:true});
 document.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(Math.abs(e.touches[0].clientX-x0)>Math.max(14,dy*.8)||document.querySelector('.item.swopen,.item.swmoving')){y0=null;const p=ptrEl();p.style.opacity=0;p.style.transform='translateY(-160px)';return}const p=ptrEl();
  if(dy<=0){p.style.opacity=0;return}const d=Math.min(dy*.5,70);p.style.transition='none';p.style.opacity=Math.min(1,dy/90);p.style.transform=`translateY(${d-40}px) rotate(${dy*1.4}deg)`},{passive:true});
 document.addEventListener('touchend',()=>{if(y0==null)return;const p=ptrEl();p.style.transition='transform .25s,opacity .25s';
  if(dy>110)doRefresh();else{p.style.opacity=0;p.style.transform='translateY(-160px)'}y0=null;dy=0});
})();
/* ---- swipe a mail: → ♥ favorito / leído · ← archivar / papelera ---- */
/* ---- deslizar un correo: aparecen 3 botoncitos; nada se hace hasta tocar uno, y se confirma ---- */
const SW_R=[['fav','heart','sw_love','#5B1A2C'],['star','star','sw_star','#8C6A43'],['pin','pin','sw_pin','#24476B']];   // deslizar → (aparecen a la izquierda)
const SW_L=[['reply','reply','reply','#2F6A66'],['fwd','fwd','fwd','#56602F'],['del','trash','del','#8E2C2C']];          // deslizar ← (aparecen a la derecha)
const SW_W=64;
function swClose(){document.querySelectorAll('.swtray').forEach(x=>x.remove());document.querySelectorAll('.item.swopen').forEach(el=>{el.classList.remove('swopen');el.style.transition='transform .2s';el.style.transform=''})}
function swDo(el,k){const m=mails.find(x=>x.id===el.dataset.open);swClose();if(!m)return;
 if(k==='fav'){const i=favs.indexOf(m.from.e);if(i<0)favs.push(m.from.e);else favs.splice(i,1);hook('prefs');toast(i<0?t('sw_faved'):t('sw_unfaved'),{wine:true,ms:1600});renderAll()}
 else if(k==='star'){m.star=!m.star;hook('star',m);toast(m.star?t('sw_starred'):t('sw_unstarred'),{wine:true,ms:1600});renderAll()}
 else if(k==='pin'){m.pin=!m.pin;hook('prefs');toast(m.pin?t('sw_pinned'):t('sw_unpinned'),{wine:true,ms:1600});renderAll()}
 else if(k==='reply')openCompose({from:m.to,to:m.from.e,toName:m.from.n,sub:/^re:/i.test(m.sub)?m.sub:'Re: '+m.sub});
 else if(k==='fwd')openCompose({from:m.to,sub:'Fwd: '+m.sub,body:`\n\n---------- ${t('fwd')} ----------\n${t('from')}: ${m.from.n} <${m.from.e}>\n${t('subject')}: ${m.sub}\n\n${m.body}`});
 else if(k==='del')moveMail(m,'trash',t('deleted'))}
function swOpen(el,dir){const acts=dir>0?SW_R:SW_L,tr=document.createElement('div');tr.className='swtray '+(dir>0?'l':'r');
 const par=el.parentNode;if(getComputedStyle(par).position==='static')par.style.position='relative';
 tr.style.top=(el.getBoundingClientRect().top-par.getBoundingClientRect().top+par.scrollTop)+'px';tr.style.height=el.offsetHeight+'px';
 tr.innerHTML=acts.map(([k,icn,lab,c])=>`<button data-sw="${k}" style="--c:${c}"><b>${ic(icn)}</b><span>${t(lab)}</span></button>`).join('');
 par.insertBefore(tr,el);el.classList.add('swopen');el.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';el.style.transform=`translateX(${dir*SW_W*3.2}px)`;
 tr.onclick=ev=>{ev.stopPropagation();const b=ev.target.closest('[data-sw]');if(!b)return;const k=b.dataset.sw;
  if(k==='reply'||k==='fwd'){swDo(el,k);return}                          // solo abren el editor: no hace falta confirmar
  if(b.classList.contains('ask')){swDo(el,k);return}
  tr.querySelectorAll('.ask').forEach(x=>{x.classList.remove('ask');x.querySelector('span').textContent=t(SW_R.concat(SW_L).find(a=>a[0]===x.dataset.sw)[2])});
  b.classList.add('ask');b.querySelector('span').textContent=t('sw_sure')}}
(()=>{let it=null,x0=0,y0=0,dx=0,mode=null;
 document.addEventListener('touchstart',e=>{if(e.target.closest('.swtray'))return;const el=e.target.closest('.item[data-k="m"]');
  if(document.querySelector('.item.swopen')&&!(el&&el.classList.contains('swopen'))){swClose();it=null;return}
  if(!el){it=null;return}it=el;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;mode=null},{passive:true});
 document.addEventListener('touchmove',e=>{if(!it)return;const x=e.touches[0].clientX-x0,y=e.touches[0].clientY-y0;
  if(!mode){if(Math.abs(x)>14&&Math.abs(x)>Math.abs(y)*1.5){mode='h';if(it.classList.contains('swopen')){swClose();it=null;return}}else if(Math.abs(y)>10){it=null;return}else return}
  dx=Math.max(-SW_W*3.5,Math.min(SW_W*3.5,x));it.classList.add('swmoving');it.style.transition='none';it.style.transform=`translateX(${dx}px)`},{passive:true});
 document.addEventListener('touchend',()=>{if(!it||mode!=='h'){it=null;return}const el=it;it=null;el.classList.remove('swmoving');el.dataset.swiped=1;setTimeout(()=>{delete el.dataset.swiped},400);
  if(Math.abs(dx)>50)swOpen(el,dx>0?1:-1);else{el.style.transition='transform .2s';el.style.transform=''}});
})();
